name: audio-sarvam
# Makes Kannada audio with Sarvam AI. Run it by hand from the Actions tab.
# Needs the repository secret SARVAM_API_KEY (Settings → Secrets and variables → Actions).
#   mode "sample": six short phrases per voice, offered as a download on the run page. Nothing is committed.
#   mode "full":   every phrase in one voice, committed as the Sarvam voice pack, then the site is republished.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: sample = try voices · full = make and publish the pack
        type: choice
        options: [sample, full]
        default: sample
      speakers:
        description: 'sample: voices to try, comma-separated'
        default: ritu,kavya,kavitha,roopa,gokul
      speaker:
        description: 'full: the one voice to use'
        default: ritu
      pace:
        description: Speaking pace (0.5 to 2.0, 1.0 = normal)
        default: '0.9'
      model:
        description: Sarvam model
        type: choice
        options: ['bulbul:v3', 'bulbul:v4-flash']
        default: 'bulbul:v3'
      force:
        description: 'full: regenerate clips that already exist'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the key is set
        run: test -n "$SARVAM_API_KEY" || { echo "::error::Add the repository secret SARVAM_API_KEY first."; exit 1; }
      - name: Sample voices
        if: inputs.mode == 'sample'
        run: node scripts/gen-audio-sarvam.mjs --sample --speakers "${{ inputs.speakers }}" --pace "${{ inputs.pace }}" --model "${{ inputs.model }}"
      - name: Offer the samples as a download
        if: inputs.mode == 'sample'
        uses: actions/upload-artifact@v4
        with:
          name: sarvam-voice-samples
          path: samples/sarvam
          if-no-files-found: error
      - name: Generate the full pack
        if: inputs.mode == 'full'
        run: node scripts/gen-audio-sarvam.mjs --speaker "${{ inputs.speaker }}" --pace "${{ inputs.pace }}" --model "${{ inputs.model }}" ${{ inputs.force && '--force' || '' }}
      - name: Refresh the offline file list and check
        if: inputs.mode == 'full'
        run: npm run sw && npm run check
      - name: Commit and push
        if: inputs.mode == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/audio app/sw.js
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -m "Sarvam voice pack: ${{ inputs.speaker }}, ${{ inputs.model }}, pace ${{ inputs.pace }}"
          git push
      - name: Publish the site
        if: inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
