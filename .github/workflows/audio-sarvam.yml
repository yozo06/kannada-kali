name: audio-sarvam
# Generates the Sarvam voice pack and commits it. Run it by hand from the Actions tab.
# Needs the repository secret SARVAM_API_KEY (Settings → Secrets and variables → Actions).
on:
  workflow_dispatch:
    inputs:
      speaker:
        description: Sarvam speaker name
        default: ritu
      pace:
        description: Speaking pace (1.0 = normal)
        default: '0.9'
      sample:
        description: Only make 6 sample clips (to judge the voice)
        type: boolean
        default: false
      force:
        description: Regenerate clips that already exist
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate clips
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: node scripts/gen-audio-sarvam.mjs --speaker "${{ inputs.speaker }}" --pace "${{ inputs.pace }}" ${{ inputs.sample && '--sample' || '' }} ${{ inputs.force && '--force' || '' }}
      - name: Refresh the offline file list and check
        run: npm run sw && npm run check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/audio app/sw.js
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -m "Sarvam voice pack: ${{ inputs.speaker }}, pace ${{ inputs.pace }}${{ inputs.sample && ' (sample)' || '' }}"
          git push
      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
